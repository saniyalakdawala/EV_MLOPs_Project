services:
  backend:
    build:
      context: ./backend
      args:
        INCLUDE_XGBOOST: ${INCLUDE_XGBOOST:-false}
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DEBUG: "false"
      DB_HOST: host.docker.internal
      DB_USER: ${DB_USER:?Set DB_USER in your local environment}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local environment}
      FORECAST_MODEL_PATH: /app/models/current/model.joblib
      FORECAST_LOG_PATH: /app/data/forecast/predictions.csv
      FORECAST_ACTUALS_PATH: /app/data/forecast/actuals.csv
      MLFLOW_TRACKING_URI: http://mlflow:5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    ports: ["8000:8000"]
    volumes:
      - ./backend/models:/app/models:ro
      - ./data/forecast:/app/data/forecast
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - voltgrid-api
  streamlit:
    build: .
    environment:
      VOLTGRID_API_URL: http://backend:8000
    ports: ["${STREAMLIT_PORT:-8501}:8501"]
    depends_on:
      backend:
        condition: service_healthy
  mlflow:
    profiles: [observability]
    build:
      context: ./backend
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--serve-artifacts", "--artifacts-destination", "/mlflow/artifacts"]
    ports: ["5000:5000"]
    volumes:
      - mlflow-data:/mlflow
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.53.3
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [backend]
  grafana:
    profiles: [observability]
    image: grafana/grafana:11.4.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your local environment}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/voltgrid.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  mlflow-data:
  grafana-data:
