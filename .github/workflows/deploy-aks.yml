name: VoltGrid gated AKS deployment
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA tag to deploy after CI succeeds
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Require a commit tag with successful CI
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          gh run list --workflow ci.yml --commit "$IMAGE_TAG" --json conclusion --jq 'any(.[]; .conclusion == "success")' | grep -qx true
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ inputs.image_tag }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
      - name: Confirm both images exist in ACR
        run: |
          az acr repository show --name "$ACR_NAME" --image "voltgrid-api:$IMAGE_TAG" >/dev/null
          az acr repository show --name "$ACR_NAME" --image "voltgrid-frontend:$IMAGE_TAG" >/dev/null
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
      - name: Update image and wait for healthy rollout
        run: |
          kubectl -n voltgrid set image deployment/voltgrid-api api="$ACR_LOGIN_SERVER/voltgrid-api:$IMAGE_TAG"
          kubectl -n voltgrid set image deployment/voltgrid-frontend frontend="$ACR_LOGIN_SERVER/voltgrid-frontend:$IMAGE_TAG"
          kubectl -n voltgrid rollout status deployment/voltgrid-api --timeout=180s
          kubectl -n voltgrid rollout status deployment/voltgrid-frontend --timeout=180s
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ inputs.image_tag }}
