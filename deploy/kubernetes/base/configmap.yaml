apiVersion: v1
kind: ConfigMap
metadata:
  name: voltgrid-config
  namespace: voltgrid
data:
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  DEBUG: "false"
  DB_HOST: "postgres.example.internal"
  DB_PORT: "5432"
  DB_NAME: "ev_db"
  FORECAST_MODEL_PATH: "/models/current/model.joblib"
  FORECAST_LOG_PATH: "/var/forecast/predictions.csv"
  FORECAST_ACTUALS_PATH: "/var/forecast/actuals.csv"
