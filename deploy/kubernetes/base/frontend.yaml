apiVersion: apps/v1
kind: Deployment
metadata:
  name: voltgrid-frontend
  namespace: voltgrid
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voltgrid-frontend
  template:
    metadata:
      labels:
        app: voltgrid-frontend
    spec:
      containers:
        - name: frontend
          image: voltgridacr.azurecr.io/voltgrid-frontend:replace-me
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
      securityContext:
        fsGroup: 101
---
apiVersion: v1
kind: Service
metadata:
  name: voltgrid-frontend
  namespace: voltgrid
spec:
  type: LoadBalancer
  selector:
    app: voltgrid-frontend
  ports:
    - port: 80
      targetPort: http
