apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voltgrid
resources:
  - ../../base
images:
  - name: voltgridacr.azurecr.io/voltgrid-api
    newName: voltgridacr.azurecr.io/voltgrid-api
    newTag: replace-me
  - name: voltgridacr.azurecr.io/voltgrid-frontend
    newName: voltgridacr.azurecr.io/voltgrid-frontend
    newTag: replace-me
patches:
  - target:
      kind: PersistentVolumeClaim
      name: voltgrid-models
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: azurefile-csi
  - target:
      kind: PersistentVolumeClaim
      name: voltgrid-forecast-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: azurefile-csi
